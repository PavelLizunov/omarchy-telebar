[package]
name = "telebar-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
libc = "0.2"
libloading = "0.8"
indexmap = "2"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
unicode-general-category = "1.1"

[profile.release]
overflow-checks = true

[[bin]]
name = "telebar-runtime"
path = "src/main.rs"
